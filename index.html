<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Pełne drzewo genealogiczne rodziny Kuropków">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Rodzina Kuropków — całe drzewo</title>
<style>
  :root {
    color-scheme: light;
    --ink: #263b35;
    --muted: #64736d;
    --paper: #f5f6f1;
    --card: #fffefa;
    --line: #d7dfd8;
    --action: #355b45;
    --action-hover: #264a36;
    --edge: #91aa98;
  }
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body {
    margin: 0;
    color: var(--ink);
    background: var(--paper);
    font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
  }
  header {
    padding: 26px 18px 20px;
    text-align: center;
    background: linear-gradient(145deg, #f8f6ed, #eaf1e9);
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font: 600 clamp(25px, 4vw, 38px)/1.15 Georgia, serif; }
  main { width: 100%; margin: 0 auto; padding: 18px; }
  button {
    min-width: 40px;
    min-height: 36px;
    padding: 4px 10px;
    color: var(--action);
    background: #e1ebe2;
    border: 1px solid #b9cbbd;
    border-radius: 9px;
    font: inherit;
    font-size: 18px;
    cursor: pointer;
  }
  button:hover { color: white; background: var(--action-hover); }
  button:focus-visible, a:focus-visible {
    outline: 3px solid #d59a50;
    outline-offset: 3px;
  }
  .graph-frame {
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overscroll-behavior-x: contain;
    scrollbar-color: #9aac9f #edf1ec;
  }
  #family-graph { display: block; }
  .pannable { cursor: grab; user-select: none; -webkit-user-select: none; }
  .pannable.dragging, .pannable.dragging .person-node { cursor: grabbing; }
  .edge { fill: none; stroke: var(--edge); stroke-width: 1.8; }
  .marriage-edge { fill: none; stroke: #718e79; stroke-width: 2.4; }
  .person-node rect { fill: #eaf1e9; stroke: #a9bfad; stroke-width: 1.4; rx: 9; }
  .person-node text { fill: #15271c; text-anchor: middle; font-size: 11px; font-weight: 600; }
  .person-node .person-year { fill: #34463b; font-size: 10px; font-weight: 400; }
  .person-node .person-maiden { fill: #2a4433; font-size: 10px; font-weight: 400; font-style: italic; }
  .marriage-year { fill: var(--action); font-size: 9px; font-weight: 700; }
  .union-node circle { fill: var(--action); stroke: var(--card); stroke-width: 2; }
  .person-node { cursor: pointer; }
  .person-node:hover rect, .person-node:focus rect { fill: #d5e4d8; stroke: #355b45; }
  .person-node:focus { outline: none; }
  .person-node.current rect { fill: var(--action); stroke: #264a36; }
  .person-node.current text, .person-node.current .person-year, .person-node.current .person-maiden { fill: white; }
  .person-node.ancestor rect { fill: #b3cfba; stroke: #4f7a5d; }
  #person-details { width: min(1164px, 100%); margin: 14px auto 0; }
  .details-card {
    padding: 16px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .details-card h2 { margin: 0 0 4px; font: 600 20px/1.25 Georgia, serif; }
  .details-card .hint { margin: 0; color: var(--muted); }
  .details-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
    gap: 8px;
    margin-top: 10px;
  }
  .details-box { padding: 10px 12px; background: #f8f9f5; border: 1px solid #e6ebe5; border-radius: 10px; }
  .details-box h3 { margin: 0 0 4px; color: var(--action); font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .03em; }
  .details-box p { margin: 2px 0; }
  .person-link {
    min-width: 0;
    min-height: 0;
    padding: 0;
    color: var(--action);
    background: none;
    border: 0;
    font-size: inherit;
    text-align: left;
    text-decoration: underline;
    cursor: pointer;
  }
  .person-link:hover { color: var(--action-hover); background: none; }
  .muted { color: var(--muted); font-size: 13px; }
  #status { color: var(--muted); }
  .error { color: #9c2f25 !important; }
  .page-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: min(1200px, 100%);
    margin: 0 auto;
    padding: 0 18px 12px;
  }
  .footer-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .print-button {
    display: inline-block;
    border: 1px solid;
    border-radius: 9px;
    font-family: inherit;
    line-height: 1.2;
    text-decoration: none;
    cursor: pointer;
    min-height: 0;
    padding: 7px 14px;
    color: white;
    background: var(--action);
    border-color: var(--action);
    font-size: 13px;
  }
  .copyright { color: var(--muted); font-size: 11px; }
  .copyright a { color: inherit; text-decoration: none; }
  @media print {
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { background: white; }
    header { padding: 0 0 4mm; background: none; border: 0; }
    h1 { font-size: 20pt; }
    main { width: 100%; padding: 0; }
    .page-footer, #status, #person-details, .header-actions { display: none !important; }
    .graph-frame { width: 100%; overflow: visible; max-height: none; min-height: 0; padding: 0; border: 0; }
    #family-graph { width: 100%; height: auto; }
  }
  @media (max-width: 560px) {
    main { padding: 12px; }
    .graph-frame { padding: 8px; }
  }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 18px;
  }
  .nav-button {
    display: inline-block;
    min-width: 120px;
    padding: 10px 20px;
    color: var(--action);
    background: #e1ebe2;
    border: 1px solid #b9cbbd;
    border-radius: 10px;
    font: 600 15px/1.45 system-ui, "Segoe UI", sans-serif;
    text-align: center;
    text-decoration: none;
  }
  .nav-button:hover, .nav-button:focus-visible { color: white; background: var(--action-hover); border-color: var(--action-hover); }
  .nav-button:focus-visible { outline: 3px solid #d59a50; outline-offset: 3px; }
  .nav-button[aria-current="page"] {
    color: white;
    background: var(--action);
    border-color: #264a36;
    box-shadow: 0 2px 6px rgba(38, 74, 54, .18);
    cursor: default;
  }
  @media (max-width: 420px) {
    .nav-button { min-width: 0; padding: 9px 13px; font-size: 14px; }
  }
  /* Wyrazistsza paleta dla ekranów komputerowych */
  @media screen and (min-width: 768px) and (hover: hover) {
    :root {
      --ink: #172a22;
      --muted: #46594f;
      --paper: #eaf0e6;
      --line: #b4c7b8;
      --action: #2b6844;
      --action-hover: #1b4e30;
      --edge: #6a9077;
      --accent: #3c7a55;
      --accent-soft: #d7eadb;
    }
    header { background: linear-gradient(145deg, #f2ecd6, #cfe4d3); border-bottom-color: #a9c1ae; }
    .nav-button { background: #d0e4d4; border-color: #8fb398; }
    .graph-frame, .details-card, .family-map, .family-view, .panel { border-color: #b4c7b8; box-shadow: 0 2px 12px rgba(27, 78, 48, .09); }
    .details-box, .person, #document-list a { background: #eef5ec; border-color: #c9d9cc; }
    .child { border-color: #c9d9cc; }
    .person-node rect { fill: #d2e7d7; stroke: #7da387; }
    .person-node text { fill: #0f2117; }
    .marriage-edge { stroke: #557d63; }
    button { background: #d0e4d4; border-color: #8fb398; }
    button:hover { background: var(--action-hover); }
    .person-node:hover rect, .person-node:focus rect { fill: #b9d9c1; stroke: #2b6844; }
    .person-node.ancestor rect { fill: #9fcaab; stroke: #357050; }
    .person-node.current rect { fill: var(--action); stroke: #1b4e30; }
  }</style>
</head>
<body>
<header>
  <h1>Rodzina Kuropków</h1>
  <nav class="header-actions" aria-label="Widoki strony">
    <a class="nav-button" href="./index.html" aria-current="page">Całe drzewo</a>
    <a class="nav-button" href="./rodziny.html">Rodziny</a>
    <a class="nav-button" href="./dokumenty.html">Dokumenty</a>
  </nav>
</header>
<main>
  <p id="status" role="status">Wczytywanie danych…</p>
  <div class="graph-frame" tabindex="0" role="region" aria-label="Pełny graf rodziny, przewijany poziomo">
    <svg id="family-graph" role="img" aria-label="Pełny graf osób i rodzin"></svg>
  </div>
  <section id="person-details" aria-live="polite"><div class="details-card"><p class="hint">Kliknij osobę na grafie, aby zobaczyć jej dane.</p></div></section>
</main>
<footer class="page-footer">
  <nav class="footer-actions" aria-label="Dodatkowe funkcje">
    <button id="print-tree" class="print-button" type="button">Drukuj</button>
  </nav>
  <small class="copyright"><a href="mailto:dkuropka@gmail.com">©Dominik</a></small>
</footer>
<script src="./lib/sql-wasm.js"></script>
<script src="./drzewo-db.js?v=5"></script>
<script src="./drzewo-uklad.js?v=5"></script>
<script>
  "use strict";

  const svg = document.getElementById("family-graph");
  const frame = document.querySelector(".graph-frame");
  const status = document.getElementById("status");
  const printStyle = document.createElement("style");
  document.head.appendChild(printStyle);
  const details = document.getElementById("person-details");
  let data;

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, character => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[character]);
  }

  function personLink(person) {
    return `<button class="person-link" type="button" data-person="${person.id}">${escapeHtml(person.name)}</button>`;
  }

  function dateLine(date, place) {
    return date ? `${escapeHtml(date)}${place ? `, ${escapeHtml(place)}` : ""}` : "";
  }

  function box(title, content) {
    return content ? `<div class="details-box"><h3>${title}</h3>${content}</div>` : "";
  }

  function renderDetails(person) {
    const parentUnion = data.unions.get(person.parentUnionId);
    const parents = parentUnion
      ? parentUnion.partnerIds.map(id => `<p>${personLink(data.people.get(id))}</p>`).join("")
      : person.parentsNote ? `<p>${escapeHtml(person.parentsNote)}</p>` : "";
    const unions = person.unions.map(id => data.unions.get(id)).filter(Boolean);
    const marriages = unions.map(union => {
      const spouse = union.partnerIds.filter(id => id !== person.id).map(id => personLink(data.people.get(id))).join(", ");
      const when = [union.marriageDate && `ślub ${escapeHtml(union.marriageDate)}`, union.marriagePlace && !union.marriageDate.includes(union.marriagePlace) && escapeHtml(union.marriagePlace)].filter(Boolean).join(", ");
      return `<p>${spouse || "<span class=\"muted\">partner nieznany</span>"}${when ? `<br><span class="muted">${when}</span>` : ""}</p>`;
    }).join("");
    const children = unions.map(union => {
      if (!union.childIds.length) return "";
      const spouse = union.partnerIds.find(id => id !== person.id);
      const heading = unions.length > 1 && spouse ? `<p class="muted">z ${escapeHtml(data.people.get(spouse).name)}:</p>` : "";
      return heading + union.childIds.map(id => `<p>${personLink(data.people.get(id))}</p>`).join("");
    }).join("");
    const life = [
      person.birth ? `<p>ur. ${dateLine(person.birth, person.birthPlace)}</p>` : "",
      person.death ? `<p>zm. ${dateLine(person.death, person.deathPlace)}</p>` : "",
      person.burial ? `<p>grób: ${escapeHtml(person.burial)}</p>` : ""
    ].join("") || `<p class="muted">daty nieznane</p>`;
    details.innerHTML = `<div class="details-card">
      <h2>${escapeHtml(person.name)}</h2>
      ${person.maiden ? `<p class="muted">z domu ${escapeHtml(person.maiden)}</p>` : ""}
      <div class="details-grid">
        ${box("Daty życia", life)}
        ${box("Rodzice", parents)}
        ${box(unions.length > 1 ? "Małżeństwa" : "Małżeństwo", marriages)}
        ${box("Dzieci", children)}
        ${box("Uwagi", person.note ? `<p>${escapeHtml(person.note)}</p>` : "")}
      </div>
    </div>`;
    details.querySelectorAll("[data-person]").forEach(button => {
      button.addEventListener("click", () => selectPerson(Number(button.dataset.person), "card"));
    });
  }

  /* Wszyscy przodkowie osoby (rodzice, dziadkowie… aż do najstarszego pokolenia). */
  function ancestorsOf(id) {
    const found = new Set();
    const queue = [id];
    while (queue.length) {
      const union = data.unions.get(data.people.get(queue.pop())?.parentUnionId);
      if (!union) continue;
      union.partnerIds.forEach(parentId => {
        if (found.has(parentId) || parentId === id) return;
        found.add(parentId);
        queue.push(parentId);
      });
    }
    return found;
  }

  /* Zaznacza osobę na grafie i pokazuje jej dane; scrollTo: "details" po kliknięciu karty, "card" po kliknięciu odnośnika. */
  function selectPerson(id, scrollTo) {
    const person = data.people.get(id);
    if (!person) return;
    const cards = [...svg.querySelectorAll(".person-node")];
    const ancestors = ancestorsOf(id);
    cards.forEach(card => {
      const cardId = Number(card.dataset.person);
      card.classList.toggle("current", cardId === id);
      card.classList.toggle("ancestor", ancestors.has(cardId));
    });
    renderDetails(person);
    if (scrollTo === "details") details.scrollIntoView({ behavior: "smooth", block: "nearest" });
    if (scrollTo === "card") {
      const card = cards.find(item => Number(item.dataset.person) === id);
      if (card) card.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
    }
  }

  function makeSelectable(group, person) {
    group.dataset.person = person.id;
    group.setAttribute("tabindex", "0");
    group.setAttribute("role", "button");
    group.setAttribute("aria-label", `${person.name} — pokaż dane`);
    group.addEventListener("click", () => selectPerson(person.id, "details"));
    group.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        selectPerson(person.id, "details");
      }
    });
  }

  async function loadGraph() {
    try {
      data = await DrzewoDB.load();
      if (!data.families.length) throw new Error("Baza danych nie zawiera żadnych związków.");
      const roots = data.families
        .filter(root => root.partners?.[0])
        .map(root => ({ person: root.partners[0], branches: [root] }));
      const { width, height, firstRootCenter } = DrzewoUklad.render(svg, roots, { onPerson: makeSelectable, compact: true, cardWidth: 76, maidenLine: true });
      // Strona PDF dopasowana proporcjami do grafu: cały graf na jednej stronie, w wektorze.
      const pageWidthMm = 420;
      const pageHeightMm = Math.ceil(pageWidthMm * (height + 90) / width) + 12;
      printStyle.textContent = `@page { size: ${pageWidthMm}mm ${Math.max(pageHeightMm, 120)}mm; margin: 8mm; }`;
      frame.scrollLeft = Math.max(0, firstRootCenter - frame.clientWidth / 2);
      status.hidden = true;
    } catch (error) {
      status.classList.add("error");
      status.textContent = `Nie udało się wczytać pełnego drzewa: ${error.message}`;
    }
  }

  DrzewoUklad.enablePan(frame);
  document.getElementById("print-tree").addEventListener("click", () => window.print());
  loadGraph();
</script>
</body>
</html>
